name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  claude:
    name: Claude
    uses: bubblegroup/infra-configs/.github/workflows/bubble-review.yaml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    secrets: inherit
