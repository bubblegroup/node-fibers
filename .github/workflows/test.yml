name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        node: [16, 18, 20, 22]
        include:
          - os: ubuntu-latest
            node: 14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      # node-gyp 9 is the last to run on Node 14, and needs distutils, which Python 3.12 dropped
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm install -g node-gyp@9.4.1
      - run: npm install --ignore-scripts
      - run: node build.js -f
      - run: node test.js
        env:
          # Outside node_modules, process.binding prints a deprecation warning the tests read as a failure
          NODE_OPTIONS: --no-deprecation
          FIBERS_DEBUG_TLS: ''
